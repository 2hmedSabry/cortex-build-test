# cortex-build v9 stack=expo dir=.
# Made by Cortex. Builds run on your GitHub account; Cortex starts them and downloads the results.
name: Cortex Build
run-name: Cortex ${{ inputs.platform }} ${{ inputs.profile }} build${{ inputs.ref && format(' of {0}', inputs.ref) || '' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios, both]
        default: android
      profile:
        type: choice
        options: [debug, release, publish, dev]
        default: debug
      ref:
        description: The branch, tag or commit to build (empty = the branch this runs on)
        required: false
        default: ""

env:
  APP_DIR: .
  # A development build (dev) is a test build that loads its JavaScript live from Metro.
  PROFILE: ${{ inputs.profile == 'dev' && 'debug' || inputs.profile }}
  LIVE: ${{ inputs.profile == 'dev' }}

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ${{ fromJSON(vars.CORTEX_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 90
    env:
      CORTEX_ANDROID_KEYSTORE_BASE64: ${{ secrets.CORTEX_ANDROID_KEYSTORE_BASE64 }}
      CORTEX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CORTEX_ANDROID_KEYSTORE_PASSWORD }}
      CORTEX_ANDROID_KEY_ALIAS: ${{ secrets.CORTEX_ANDROID_KEY_ALIAS }}
      CORTEX_ANDROID_KEY_PASSWORD: ${{ secrets.CORTEX_ANDROID_KEY_PASSWORD }}
      CORTEX_ENV_FILE: ${{ secrets.CORTEX_ENV_FILE }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Pick the build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Write your .env
        if: env.CORTEX_ENV_FILE != ''
        run: printf '%s\n' "$CORTEX_ENV_FILE" > .env
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: |
          npm ci
      - name: Use the eas.json build settings
        run: |
          node - <<'JS'
          const fs = require("fs");
          if (!fs.existsSync("eas.json")) process.exit(0);
          const builds = JSON.parse(fs.readFileSync("eas.json", "utf8")).build || {};
          const names = process.env.LIVE === "true" ? ["development", "preview"] : process.env.PROFILE === "debug" ? ["preview", "development"] : ["production"];
          const name = names.find((n) => builds[n]);
          if (!name) process.exit(0);
          const env = {};
          const take = (n, seen) => {
              const b = builds[n];
              if (!b || seen.has(n)) return;
              seen.add(n);
              if (b.extends) take(b.extends, seen);
              Object.assign(env, b.env || {});
          };
          take(name, new Set());
          const out = Object.entries(env).map(([k, v]) => `${k}<<CORTEX_EOF\n${v}\nCORTEX_EOF\n`).join("");
          fs.appendFileSync(process.env.GITHUB_ENV, out);
          console.log(`Using the env of the eas.json "${name}" profile: ${Object.keys(env).join(", ") || "(none)"}`);
          JS
      - name: Add the development client
        if: env.LIVE == 'true'
        run: |
          npx expo install expo-dev-client
      - name: Make the native project
        run: |
          if [ -f android/gradlew ]; then echo "Using the android project in the repo"; else npx expo prebuild --platform android --no-install --clean; fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          if [ "$PROFILE" != debug ]; then
            # Every store upload needs a higher versionCode: use the build number.
            find . -maxdepth 2 -name 'build.gradle*' -exec sed -i -E "s/versionCode( =)? [0-9]+/versionCode\1 $BUILD_NUMBER/" {} +
            ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          elif [ "$LIVE" = true ]; then
            # A development build: its JavaScript comes from Metro, live.
            ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          else
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          fi
      - name: Sign with your keystore
        if: env.PROFILE != 'debug' && env.CORTEX_ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$CORTEX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          find . -path ./node_modules -prune -o -name '*-release*.apk' -print | while read -r apk; do
            out="${apk%.apk}-signed.apk"
            zip -q -d "$apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/*.MF' || true
            "$BT/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:CORTEX_ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$CORTEX_ANDROID_KEY_ALIAS" --key-pass env:CORTEX_ANDROID_KEY_PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
          done
          find . -path ./node_modules -prune -o -name '*.aab' -print | while read -r aab; do
            # Release builds may come signed with a debug key; Google Play wants only yours.
            zip -q -d "$aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/*.MF' || true
            jarsigner -keystore "$RUNNER_TEMP/release.keystore" -storepass "$CORTEX_ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$CORTEX_ANDROID_KEY_PASSWORD" "$aab" "$CORTEX_ANDROID_KEY_ALIAS"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.PROFILE }}
          if-no-files-found: error
          path: |
            ./**/outputs/**/*.apk
            ./**/outputs/**/*.aab
            !**/node_modules/**
            !**/intermediates/**
      - name: Upload to Google Play (internal testing)
        if: env.PROFILE == 'publish'
        shell: bash
        env:
          CORTEX_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.CORTEX_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for v in CORTEX_ANDROID_KEYSTORE_BASE64 CORTEX_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!v}" ]; then echo "::error::Publishing to Google Play needs the $v secret in this repo (Settings > Secrets > Actions)."; exit 1; fi
          done
          AAB=$(find . -path ./node_modules -prune -o -name '*.aab' -print | head -1)
          APK=$(find . -path ./node_modules -prune -o -name '*-release*-signed.apk' -print | head -1)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          PKG=$("$BT/aapt2" dump packagename "$APK")
          python3 -m venv "$RUNNER_TEMP/play"
          "$RUNNER_TEMP/play/bin/pip" install --quiet google-api-python-client google-auth
          "$RUNNER_TEMP/play/bin/python" - "$PKG" "$AAB" <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          from googleapiclient.http import MediaFileUpload
          pkg, aab = sys.argv[1], sys.argv[2]
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["CORTEX_PLAY_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"])
          edits = build("androidpublisher", "v3", credentials=creds, cache_discovery=False).edits()
          def publish(status):
              edit = edits.insert(packageName=pkg, body={}).execute()["id"]
              media = MediaFileUpload(aab, mimetype='application/octet-stream', resumable=True)
              code = edits.bundles().upload(packageName=pkg, editId=edit, media_body=media).execute()["versionCode"]
              body = {"releases": [{"versionCodes": [str(code)], "status": status}]}
              edits.tracks().update(packageName=pkg, editId=edit, track="internal", body=body).execute()
              edits.commit(packageName=pkg, editId=edit).execute()
              print(f"Uploaded {pkg} version {code} to internal testing ({status})")
          try:
              publish("completed")
          except HttpError as e:
              if "draft" not in str(e).lower():
                  raise
              publish("draft")
          PY

  ios:
    if: inputs.platform != 'android'
    runs-on: ${{ fromJSON(vars.CORTEX_MAC_RUNNER || '"macos-latest"') }}
    timeout-minutes: 90
    env:
      CORTEX_APPLE_TEAM_ID: ${{ secrets.CORTEX_APPLE_TEAM_ID }}
      CORTEX_ASC_KEY_ID: ${{ secrets.CORTEX_ASC_KEY_ID }}
      CORTEX_ASC_ISSUER_ID: ${{ secrets.CORTEX_ASC_ISSUER_ID }}
      CORTEX_ASC_KEY_P8: ${{ secrets.CORTEX_ASC_KEY_P8 }}
      CORTEX_ENV_FILE: ${{ secrets.CORTEX_ENV_FILE }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Pick the build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Write your .env
        if: env.CORTEX_ENV_FILE != ''
        run: printf '%s\n' "$CORTEX_ENV_FILE" > .env
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: |
          npm ci
      - name: Use the eas.json build settings
        run: |
          node - <<'JS'
          const fs = require("fs");
          if (!fs.existsSync("eas.json")) process.exit(0);
          const builds = JSON.parse(fs.readFileSync("eas.json", "utf8")).build || {};
          const names = process.env.LIVE === "true" ? ["development", "preview"] : process.env.PROFILE === "debug" ? ["preview", "development"] : ["production"];
          const name = names.find((n) => builds[n]);
          if (!name) process.exit(0);
          const env = {};
          const take = (n, seen) => {
              const b = builds[n];
              if (!b || seen.has(n)) return;
              seen.add(n);
              if (b.extends) take(b.extends, seen);
              Object.assign(env, b.env || {});
          };
          take(name, new Set());
          const out = Object.entries(env).map(([k, v]) => `${k}<<CORTEX_EOF\n${v}\nCORTEX_EOF\n`).join("");
          fs.appendFileSync(process.env.GITHUB_ENV, out);
          console.log(`Using the env of the eas.json "${name}" profile: ${Object.keys(env).join(", ") || "(none)"}`);
          JS
      - name: Add the development client
        if: env.LIVE == 'true'
        run: |
          npx expo install expo-dev-client
      - name: Make the native project
        run: |
          if [ -f ios/Podfile ]; then echo "Using the ios project in the repo"; else npx expo prebuild --platform ios --no-install --clean; fi
          cd ios && pod install
      - name: Build
        shell: bash
        env:
          IOS_DIR: ios
          SIM_CONFIG: ${{ env.LIVE == 'true' && 'Debug' || 'Release' }}
        run: |
          cd "$IOS_DIR"
          WS=$(ls -d *.xcworkspace 2>/dev/null | grep -v "^Pods" | head -1 || true)
          if [ -n "$WS" ]; then SRC=(-workspace "$WS"); NAME="${WS%.xcworkspace}"; else
            PR=$(ls -d *.xcodeproj 2>/dev/null | head -1 || true); [ -n "$PR" ] || { echo "::error::No Xcode project in $IOS_DIR"; exit 1; }; SRC=(-project "$PR"); NAME="${PR%.xcodeproj}"; fi
          SCHEMES=$(xcodebuild "${SRC[@]}" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join((d.get("workspace") or d.get("project"))["schemes"]))')
          SCHEME=$(echo "$SCHEMES" | grep -x "$NAME" || echo "$SCHEMES" | grep -v -i -E "pods|tests" | head -1 || true)
          echo "Building $NAME, scheme $SCHEME"
          OUT="$GITHUB_WORKSPACE/cortex-out"; mkdir -p "$OUT"
          if [ "$PROFILE" = debug ]; then
            xcodebuild "${SRC[@]}" -scheme "$SCHEME" -configuration "$SIM_CONFIG" -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -n 200
            cp -R build/dd/Build/Products/"$SIM_CONFIG"-iphonesimulator/*.app "$OUT/"
            exit 0
          fi
          for v in CORTEX_APPLE_TEAM_ID CORTEX_ASC_KEY_ID CORTEX_ASC_ISSUER_ID CORTEX_ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::A release iPhone build needs the $v secret in this repo (Settings > Secrets > Actions)."; exit 1; fi
          done
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if echo "$CORTEX_ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then echo "$CORTEX_ASC_KEY_P8" > "$KEY"; else echo "$CORTEX_ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          find . -name Info.plist -not -path '*/Pods/*' -not -path '*/build/*' -not -path '*/node_modules/*' | while read -r plist; do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist" 2>/dev/null || true)
            case "$v" in ""|\$*) ;; *) /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist" ;; esac
          done
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$CORTEX_ASC_KEY_ID" -authenticationKeyIssuerID "$CORTEX_ASC_ISSUER_ID")
          xcodebuild "${SRC[@]}" -scheme "$SCHEME" -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" "${AUTH[@]}" DEVELOPMENT_TEAM="$CORTEX_APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" FLUTTER_BUILD_NUMBER="$BUILD_NUMBER" archive | tail -n 200
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$CORTEX_APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$OUT" "${AUTH[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.PROFILE }}
          if-no-files-found: error
          path: cortex-out
      - name: Upload to TestFlight
        if: env.PROFILE == 'publish'
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/upload" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$CORTEX_ASC_KEY_ID" -authenticationKeyIssuerID "$CORTEX_ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows up in TestFlight once Apple has processed it (usually 5-30 minutes)."
